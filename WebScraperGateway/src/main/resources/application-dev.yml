server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:5173,http://localhost:3000"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: true

          default-filters:
            - RemoveRequestHeader=X-User-*,X-Role-*
            - PreserveHostHeader

          routes:
            - id: scraper-api
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/products/**,/api/v1/clients/**,/api/v1/favorites/**

            - id: user-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/users/**

            - id: auth-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/v1/auth/**

            - id: scraper-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/scraper/**
